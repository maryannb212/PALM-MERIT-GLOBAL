services:
  db:
    image: postgres:15-alpine
    container_name: palmmerit_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-palmmerit}
    ports:
      - "5432:5432"
    volumes:
      - ./server/db_data:/var/lib/postgresql/data

  server:
    build: ./server
    container_name: palmmerit_api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_USER: ${DB_USER:-postgres}
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-palmmerit}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
    depends_on:
      - db

  client:
    build: 
      context: ./client
      args:
        - VITE_API_BASE_URL=http://localhost:5000/api
    container_name: palmmerit_web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
