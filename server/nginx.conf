server {
    listen 80;
    server_name api.palmmeritglobal.com; # Replace with your domain

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.palmmeritglobal.com; # Replace with your domain

    # SSL Configuration (Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/api.palmmeritglobal.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.palmmeritglobal.com/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Backend Proxy
    location / {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhook timeout extension (Paystack/Flutterwave)
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Error handling
    error_page 502 /502.html;
    location = /502.html {
        return 502 '{"message": "Backend is currently down. Please try again later."}';
        default_type application/json;
    }
}
