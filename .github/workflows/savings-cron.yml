name: Savings Cron Jobs

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  run-savings-cron:
    name: Run deduction and penalty jobs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run deduction job
        run: npm run cron:deduction

      - name: Run penalty job
        run: npm run cron:penalty
